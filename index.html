<!DOCTYPE html>
<html lang="id" dir="ltr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#0f6e56">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Quran Map">
<title>Quran Mapping — 114 surah, satu peta</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Amiri:wght@400;700&family=Lora:ital,wght@0,400;0,500;0,600;1,400&family=Source+Sans+3:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{
  --ink:#1d2b27; --ink-soft:#4c5a55; --ink-mute:#7d8a85;
  --paper:#f7f6f1; --card:#ffffff;
  --emerald:#0f6e56; --emerald-deep:#0a5040; --emerald-pale:#e4f1ec;
  --gold:#a9741a; --gold-pale:#f6eedd; --line:#e3e1d8;
  --arabic-size:34px;
  --serif:'Lora', Georgia, serif;
  --sans:'Source Sans 3', 'Segoe UI', sans-serif;
  --arabic:'Amiri', 'Traditional Arabic', 'Scheherazade New', serif;
}
body.dark{
  --ink:#e8e6e1; --ink-soft:#b0aca5; --ink-mute:#7a766f;
  --paper:#1a1a1a; --card:#252525;
  --emerald:#3dba8f; --emerald-deep:#2d9a73; --emerald-pale:#1a3a2e;
  --gold:#d4a043; --gold-pale:#2a2215; --line:#333333;
}
.theme-toggle{background:none;border:1px solid var(--line);border-radius:20px;padding:6px 12px;cursor:pointer;font-size:16px;color:var(--ink-soft);transition:all .2s}
.theme-toggle:hover{border-color:var(--emerald);color:var(--emerald)}
*{margin:0;padding:0;box-sizing:border-box}
body{background:var(--paper);color:var(--ink);font-family:var(--sans);font-size:16px;line-height:1.7}
a{color:var(--emerald);text-decoration:none}
.wrap{max-width:860px;margin:0 auto;padding:0 20px}
header{border-bottom:1px solid var(--line);background:var(--paper);position:sticky;top:0;z-index:20}
.nav{display:flex;align-items:center;justify-content:space-between;padding:14px 0;gap:16px;flex-wrap:wrap}
.brand{display:flex;align-items:baseline;gap:10px;cursor:pointer}
.brand h1{font-family:var(--serif);font-size:20px;font-weight:600;color:var(--emerald-deep)}
.brand span{font-size:12px;letter-spacing:.08em;color:var(--ink-mute)}
.nav-links{display:flex;gap:22px;font-size:14px;color:var(--ink-soft)}
.nav-links a{color:var(--ink-soft)}
.nav-links a:hover{color:var(--emerald)}
.hero{text-align:center;padding:52px 0 40px;border-bottom:1px solid var(--line)}
.hero .basmalah{font-family:var(--arabic);font-size:30px;color:var(--emerald-deep);margin-bottom:12px}
.hero h2{font-family:var(--serif);font-size:32px;font-weight:600;line-height:1.35;margin-bottom:12px}
.hero p{color:var(--ink-soft);max-width:480px;margin:0 auto 22px;font-size:15px}
.btn{display:inline-block;padding:10px 22px;border-radius:8px;font-size:14px;cursor:pointer;border:1px solid transparent;font-family:var(--sans)}
.btn-primary{background:var(--emerald);color:#fff}
.btn-primary:hover{background:var(--emerald-deep)}
.btn-ghost{border-color:var(--line);color:var(--ink-soft);background:transparent}
.btn-ghost:hover{border-color:var(--emerald);color:var(--emerald)}
.grid-head{padding:34px 0 6px}
.grid-head h3{font-family:var(--serif);font-size:22px;font-weight:600}
.grid-head p{font-size:14px;color:var(--ink-mute);margin-bottom:16px}
.surah-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px;padding-bottom:44px}
.sg-item{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:10px 12px;font-size:13px;display:flex;gap:10px;align-items:center}
.sg-item .n{color:var(--gold);font-weight:600;font-size:12px;min-width:24px}
.sg-item.on{border-color:var(--emerald);cursor:pointer}
.sg-item.on:hover{background:var(--emerald-pale)}
.sg-item.off{opacity:.55}
.sg-item.off .soon{font-size:10px;color:var(--ink-mute);display:block}
.search-bar{display:flex;gap:10px;margin-bottom:16px;flex-wrap:wrap}
.search-bar input{flex:1;min-width:200px;padding:10px 14px;border:1px solid var(--line);border-radius:8px;font-family:var(--sans);font-size:14px;background:var(--card);color:var(--ink)}
.search-bar input:focus{outline:none;border-color:var(--emerald)}
.filter-btns{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:16px}
.filter-btn{padding:6px 14px;border:1px solid var(--line);border-radius:20px;font-size:12px;cursor:pointer;background:var(--card);color:var(--ink-soft);font-family:var(--sans);transition:all .2s}
.filter-btn:hover,.filter-btn.active{border-color:var(--emerald);color:var(--emerald);background:var(--emerald-pale)}
.sg-item.hidden{display:none}
.surah-head{padding:32px 0 8px;display:flex;justify-content:space-between;align-items:flex-end;gap:16px;flex-wrap:wrap}
.eyebrow{font-size:11px;letter-spacing:.12em;color:var(--gold);font-weight:600}
.surah-head h2{font-family:var(--serif);font-size:27px;font-weight:600;margin-top:4px}
.surah-head .ar-name{font-family:var(--arabic);font-size:34px;color:var(--emerald-deep)}
.surah-desc{color:var(--ink-soft);font-size:15px;max-width:640px;padding-bottom:8px}
.toolbar{display:flex;align-items:center;gap:14px;flex-wrap:wrap;padding:14px 0 20px;border-bottom:1px solid var(--line)}
.toolbar .grow{flex:1}
.toggle{display:flex;align-items:center;gap:8px;font-size:13px;color:var(--ink-soft);cursor:pointer;user-select:none}
.switch{width:36px;height:20px;border-radius:10px;background:#cfd8d4;position:relative;transition:background .2s}
.switch::after{content:'';position:absolute;top:2px;left:2px;width:16px;height:16px;border-radius:50%;background:#fff;transition:left .2s}
.toggle.on .switch{background:var(--emerald)}
.toggle.on .switch::after{left:18px}
.font-ctl{display:flex;align-items:center;gap:6px}
.font-ctl button{width:30px;height:30px;border-radius:6px;border:1px solid var(--line);background:var(--card);cursor:pointer;font-family:var(--serif);color:var(--ink-soft)}
.font-ctl button:hover{border-color:var(--emerald);color:var(--emerald)}
.ayat{display:flex;gap:18px;padding:26px 0;border-bottom:1px solid var(--line);align-items:flex-start;scroll-margin-top:90px}
.ayat.playing{background:var(--emerald-pale);margin:0 -20px;padding-left:20px;padding-right:20px;border-radius:10px}
.ayat-side{display:flex;flex-direction:column;align-items:center;gap:10px;padding-top:6px}
.num{width:34px;height:34px;border:1px solid var(--emerald);border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:13px;color:var(--emerald)}
.play{width:34px;height:34px;border:none;border-radius:50%;background:var(--emerald);color:#fff;cursor:pointer;font-size:12px;display:flex;align-items:center;justify-content:center}
.play:hover{background:var(--emerald-deep)}
.ayat-body{flex:1;min-width:0}
.ar{font-family:var(--arabic);font-size:var(--arabic-size);line-height:2.1;text-align:right;direction:rtl;margin-bottom:12px}
.latin{font-size:15px;font-style:italic;color:var(--emerald);margin-bottom:6px;font-family:var(--serif)}
body.no-latin .latin{display:none}
.tr{font-size:15px;color:var(--ink-soft)}
.audio-note{font-size:12px;color:var(--ink-mute);margin-top:8px;display:none}
.ayat.playing .audio-note{display:block}
.section{padding:34px 0;border-bottom:1px solid var(--line)}
.section h3{font-family:var(--serif);font-size:21px;font-weight:600;margin-bottom:4px}
.section .sub{font-size:13px;color:var(--ink-mute);margin-bottom:18px}
.section p{margin-bottom:12px;color:var(--ink)}
.section p.soft{color:var(--ink-soft)}
.hikmah{list-style:none}
.hikmah li{display:flex;gap:14px;margin-bottom:14px}
.hikmah .dot{flex:none;width:26px;height:26px;border-radius:50%;background:var(--gold-pale);color:var(--gold);display:flex;align-items:center;justify-content:center;font-size:12px;font-weight:600;margin-top:2px}
.hikmah b{font-weight:600}
.hukum-item{border-left:3px solid var(--emerald);padding:2px 0 2px 16px;margin-bottom:14px}
.hukum-item .dalil{font-size:13px;color:var(--ink-mute)}
.munasabah-card{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:18px 20px;margin-bottom:12px}
.munasabah-card .rel{font-size:11px;letter-spacing:.1em;color:var(--gold);font-weight:600;margin-bottom:6px}
.rujukan{font-size:14px;color:var(--ink-soft)}
.rujukan li{margin-bottom:4px;margin-left:18px}
.status{display:inline-block;margin-top:14px;font-size:12px;padding:5px 12px;border-radius:6px;background:var(--gold-pale);color:var(--gold)}
.identitas{width:100%;border-collapse:collapse;font-size:14px}
.identitas td{padding:8px 10px;border-bottom:1px solid var(--line);vertical-align:top}
.identitas td:first-child{color:var(--ink-mute);width:140px}
.pager{display:flex;justify-content:space-between;gap:12px;padding:26px 0}
.pager a{border:1px solid var(--line);border-radius:8px;padding:10px 16px;font-size:14px;color:var(--ink-soft)}
.pager a:hover{border-color:var(--emerald);color:var(--emerald)}
footer{padding:26px 0 46px;font-size:13px;color:var(--ink-mute);display:flex;justify-content:space-between;gap:14px;flex-wrap:wrap;border-top:1px solid var(--line)}
@media (max-width:600px){
  .hero h2{font-size:25px}
  .surah-head .ar-name{font-size:28px}
  .nav-links{font-size:13px;gap:14px}
}
.tafsir-panel{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:16px 18px;margin-top:10px;font-size:14px;color:var(--ink-soft);display:none;animation:slideDown .2s ease}
.tafsir-panel.show{display:block}
.tafsir-panel .tafsir-title{font-weight:600;color:var(--gold);font-size:12px;letter-spacing:.08em;margin-bottom:8px}
.tafsir-panel p{margin-bottom:8px;line-height:1.6}
@keyframes slideDown{from{opacity:0;transform:translateY(-8px)}to{opacity:1;transform:translateY(0)}}
.ayat-actions{display:flex;gap:8px;margin-top:10px;opacity:0;transition:opacity .2s}
.ayat:hover .ayat-actions,.ayat-actions.show{opacity:1}
.ayat-action-btn{background:none;border:1px solid var(--line);border-radius:6px;padding:4px 8px;cursor:pointer;font-size:14px;transition:all .2s}
.ayat-action-btn:hover{border-color:var(--emerald);background:var(--emerald-pale)}
.copy-toast{position:fixed;bottom:20px;left:50%;transform:translateX(-50%);background:var(--emerald);color:#fff;padding:10px 20px;border-radius:8px;font-size:14px;z-index:100;animation:fadeInOut2s ease;pointer-events:none}
@keyframes fadeInOut{0%{opacity:0}20%{opacity:1}80%{opacity:1}100%{opacity:0}}
.stats-bar{display:flex;gap:16px;flex-wrap:wrap;margin-bottom:20px}
.stat-card{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:14px 18px;flex:1;min-width:120px;text-align:center}
.stat-card .stat-num{font-family:var(--serif);font-size:28px;font-weight:600;color:var(--emerald)}
.stat-card .stat-label{font-size:12px;color:var(--ink-mute);margin-top:4px}
.juz-tracker{display:grid;grid-template-columns:repeat(auto-fill,minmax(40px,1fr));gap:4px;margin-bottom:20px}
.juz-dot{width:40px;height:40px;border-radius:8px;display:flex;align-items:center;justify-content:center;font-size:11px;font-weight:600;border:1px solid var(--line);cursor:pointer;transition:all .2s}
.juz-dot.read{background:var(--emerald-pale);border-color:var(--emerald);color:var(--emerald)}
.juz-dot:hover{border-color:var(--emerald)}
.hafalan-overlay{position:fixed;bottom:80px;right:20px;background:var(--card);border:1px solid var(--line);border-radius:12px;padding:14px 18px;box-shadow:04px20pxrgba(0,0,0,.1);z-index:50;font-size:13px}
.hafalan-overlay label{display:flex;align-items:center;gap:8px;cursor:pointer}
.keyboard-hint{position:fixed;bottom:20px;right:20px;background:var(--card);border:1px solid var(--line);border-radius:8px;padding:8px 12px;font-size:11px;color:var(--ink-mute);z-index:50;opacity:.7}
</style>
</head>
<body>

<header>
  <div class="wrap nav">
    <div class="brand" onclick="location.hash=''"><h1>Quran Mapping</h1><span>114 SURAH, SATU PETA</span></div>
    <nav class="nav-links">
      <a href="#" onclick="location.hash='';return false;">Surah</a>
      <a href="#/asmaul-husna">Asmaul Husna</a>
      <a href="#/doa-sholat">Doa Sholat</a>
      <a href="#/tata-sholat">Tata Cara</a>
      <a href="#/doa-harian">Doa Harian</a>
      <a href="#/wirid">Wirid</a>
      <a href="#/tajwid">Tajwid</a>
      <button class="theme-toggle" onclick="toggleTheme()" title="Ganti tema">🌙</button>
    </nav>
  </div>
</header>

<div id="view"></div>

<footer class="wrap">
  <span>Rujukan: Tafsir Ibnu Katsir &middot; Tafsir As-Sa'di &middot; Tafsir Kemenag RI &mdash; Teks: Tanzil.net &middot; Audio: EveryAyah.com</span>
  <span>Konten berstatus draf sampai ditinjau ahli tafsir</span>
</footer>

<script src="data/manifest.js"></script>
<script>
const QARI = "Alafasy_128kbps";
const QARI_NAMA = "Mishary Rashid Alafasy";
const REGISTRY = {};
function registerSurah(d){ REGISTRY[d.nomor] = d; }
const pad = n => String(n).padStart(3,'0');
const audioUrl = (su, ay) => `https://everyayah.com/data/${QARI}/${pad(su)}${pad(ay)}.mp3`;

// === THEME ===
function toggleTheme(){
  document.body.classList.toggle('dark');
  const isDark = document.body.classList.contains('dark');
  localStorage.setItem('qm-theme', isDark?'dark':'light');
  document.querySelector('.theme-toggle').textContent = isDark?'☀️':'🌙';
}
(function(){
  const t = localStorage.getItem('qm-theme');
  if(t==='dark'){document.body.classList.add('dark');}
})();

// === LAST READ ===
function saveLastRead(surah, ayat){
  localStorage.setItem('qm-lastread', JSON.stringify({surah,ayat,time:Date.now()}));
}
function getLastRead(){
  try{return JSON.parse(localStorage.getItem('qm-lastread'));}catch(e){return null;}
}

// === BOOKMARKS ===
function getBookmarks(){
  try{return JSON.parse(localStorage.getItem('qm-bookmarks'))||[];}catch(e){return [];}
}
function toggleBookmark(surah, ayat){
  let bm = getBookmarks();
  const idx = bm.findIndex(b=>b.s===surah&&b.a===ayat);
  if(idx>=0){bm.splice(idx,1);}
  else{bm.push({s:surah,a:ayat,time:Date.now()});}
  localStorage.setItem('qm-bookmarks', JSON.stringify(bm));
  return idx<0;
}
function isBookmarked(surah, ayat){
  return getBookmarks().some(b=>b.s===surah&&b.a===ayat);
}

// === SHARE ===
function shareAyat(surah, ayat, ar, tr){
  const name = SURAH_NAMES[surah-1];
  const text = `QS. ${name} (${surah}:${ayat})\n\n${ar}\n\n${tr}\n\n— Quran Mapping`;
  if(navigator.share){
    navigator.share({title:`${name} ${surah}:${ayat}`,text}).catch(()=>{});
  } else {
    const wa = `https://wa.me/?text=${encodeURIComponent(text)}`;
    window.open(wa,'_blank');
  }
}

// === COPY AYAT ===
function copyAyat(surah, ayat, ar, tr){
  const name = SURAH_NAMES[surah-1];
  const text = ar + '\n\n' + tr + '\n\n(QS. ' + name + ': ' + ayat + ')';
  navigator.clipboard.writeText(text).then(()=>{
    showToast('Ayat disalin ke clipboard');
  }).catch(()=>{
    const ta = document.createElement('textarea');
    ta.value = text; document.body.appendChild(ta); ta.select(); document.execCommand('copy'); document.body.removeChild(ta);
    showToast('Ayat disalin');
  });
}
function showToast(msg){
  const t = document.createElement('div'); t.className='copy-toast'; t.textContent=msg; document.body.appendChild(t);
  setTimeout(()=>t.remove(),2000);
}

// === READING STATS ===
function getReadStats(){try{return JSON.parse(localStorage.getItem('qm-stats'))||{surahs:{},ayatRead:0};}catch(e){return{surahs:{},ayatRead:0};}}
function recordRead(surah, ayat){
  const stats = getReadStats();
  if(!stats.surahs[surah]) stats.surahs[surah] = [];
  if(!stats.surahs[surah].includes(ayat)){ stats.surahs[surah].push(ayat); stats.ayatRead=(stats.ayatRead||0)+1; }
  localStorage.setItem('qm-stats', JSON.stringify(stats));
}
function getReadJuz(){
  const stats = getReadStats(); const juzRead = new Set();
  for(const s of Object.keys(stats.surahs)){ const meta = SURAHS_META[parseInt(s)]; if(meta) juzRead.add(meta.juz); }
  return [...juzRead];
}

// === HAFALAN MODE ===
let hafalanMode = false;
function toggleHafalan(){
  hafalanMode = !hafalanMode;
  document.body.classList.toggle('hafalan-active', hafalanMode);
  document.querySelectorAll('.tr').forEach(el=>{ el.style.display = hafalanMode?'none':''; });
  document.querySelectorAll('.latin').forEach(el=>{ el.style.display = hafalanMode?'none':''; });
  localStorage.setItem('qm-hafalan', hafalanMode?'1':'0');
}

// === KEYBOARD NAVIGATION ===
let currentAyatIdx = 0;
document.addEventListener('keydown', (e)=>{
  if(!currentSurah) return;
  const ayats = document.querySelectorAll('.ayat');
  if(!ayats.length) return;
  if(e.key==='ArrowDown'||e.key==='j'){ e.preventDefault(); currentAyatIdx=Math.min(currentAyatIdx+1,ayats.length-1); ayats[currentAyatIdx].scrollIntoView({behavior:'smooth',block:'center'}); }
  else if(e.key==='ArrowUp'||e.key==='k'){ e.preventDefault(); currentAyatIdx=Math.max(currentAyatIdx-1,0); ayats[currentAyatIdx].scrollIntoView({behavior:'smooth',block:'center'}); }
  else if(e.key===' '){ e.preventDefault(); const btn=ayats[currentAyatIdx].querySelector('.play'); if(btn)btn.click(); }
  else if(e.key==='b'){ const a=REGISTRY[currentSurah]?.ayat[currentAyatIdx]; if(a){ toggleBookmark(currentSurah,currentAyatIdx+1); showToast(isBookmarked(currentSurah,currentAyatIdx+1)?'Bookmark ditambah':'Bookmark dihapus'); } }
});

const view = document.getElementById('view');
const audio = new Audio();
let nowPlaying = 0, sequential = false, currentSurah = 0, arSize = 34;
let activeFilter = 'all';

// Surah metadata for filtering
const SURAHS_META = {
  1:{type:'makkiyah',juz:1},2:{type:'madaniyah',juz:1},3:{type:'madaniyah',juz:3},4:{type:'madaniyah',juz:4},
  5:{type:'madaniyah',juz:6},6:{type:'makkiyah',juz:7},7:{type:'makkiyah',juz:8},8:{type:'madaniyah',juz:9},
  9:{type:'madaniyah',juz:10},10:{type:'makkiyah',juz:11},11:{type:'makkiyah',juz:11},12:{type:'makkiyah',juz:12},
  13:{type:'madaniyah',juz:13},14:{type:'makkiyah',juz:13},15:{type:'makkiyah',juz:14},16:{type:'makkiyah',juz:14},
  17:{type:'makkiyah',juz:15},18:{type:'makkiyah',juz:15},19:{type:'makkiyah',juz:16},20:{type:'makkiyah',juz:16},
  21:{type:'makkiyah',juz:17},22:{type:'madaniyah',juz:17},23:{type:'makkiyah',juz:18},24:{type:'madaniyah',juz:18},
  25:{type:'makkiyah',juz:18},26:{type:'makkiyah',juz:19},27:{type:'makkiyah',juz:19},28:{type:'makkiyah',juz:20},
  29:{type:'makkiyah',juz:20},30:{type:'makkiyah',juz:21},31:{type:'makkiyah',juz:21},32:{type:'makkiyah',juz:21},
  33:{type:'madaniyah',juz:21},34:{type:'makkiyah',juz:22},35:{type:'makkiyah',juz:22},36:{type:'makkiyah',juz:22},
  37:{type:'makkiyah',juz:23},38:{type:'makkiyah',juz:23},39:{type:'makkiyah',juz:23},40:{type:'makkiyah',juz:24},
  41:{type:'makkiyah',juz:24},42:{type:'makkiyah',juz:25},43:{type:'makkiyah',juz:25},44:{type:'makkiyah',juz:25},
  45:{type:'makkiyah',juz:25},46:{type:'makkiyah',juz:26},47:{type:'madaniyah',juz:26},48:{type:'madaniyah',juz:26},
  49:{type:'madaniyah',juz:26},50:{type:'makkiyah',juz:26},51:{type:'makkiyah',juz:26},52:{type:'makkiyah',juz:27},
  53:{type:'makkiyah',juz:27},54:{type:'makkiyah',juz:27},55:{type:'madaniyah',juz:27},56:{type:'makkiyah',juz:27},
  57:{type:'madaniyah',juz:27},58:{type:'madaniyah',juz:28},59:{type:'madaniyah',juz:28},60:{type:'madaniyah',juz:28},
  61:{type:'madaniyah',juz:28},62:{type:'madaniyah',juz:28},63:{type:'madaniyah',juz:28},64:{type:'madaniyah',juz:28},

function filterSurah(){
  const q = document.getElementById('searchInput').value.toLowerCase().trim();
  const grid = document.getElementById('surahGrid');
  if(!grid) return;
  const items = grid.querySelectorAll('.sg-item');
  items.forEach(el=>{
    const n = parseInt(el.dataset.n||el.querySelector('.n')?.textContent||'0');
    const name = SURAH_NAMES[n-1]||'';
    const meta = SURAHS_META[n]||{};
    let show = true;
    // Search filter
    if(q){
      const matchName = name.toLowerCase().includes(q);
      const matchNum = String(n).includes(q);
      const matchArti = (el.dataset.arti||'').toLowerCase().includes(q);
      if(!matchName && !matchNum && !matchArti) show = false;
    }
    // Type filter
    if(activeFilter==='makkiyah' && meta.type!=='makkiyah') show = false;
    if(activeFilter==='madaniyah' && meta.type!=='madaniyah') show = false;
    if(activeFilter==='juz28' && meta.juz!==28 && n<58) show = false;
    if(activeFilter==='juz28' && n<58 && meta.juz!==28) show = false;
    el.classList.toggle('hidden', !show);
  });
}

function setFilter(f, btn){
  activeFilter = f;
  document.querySelectorAll('.filter-btn').forEach(b=>b.classList.remove('active'));
  btn.classList.add('active');
  filterSurah();
}

  const sc = document.createElement('script');

  sc.onerror = ()=>{ view.innerHTML = `<div class="wrap"><p style="padding:60px 0;color:var(--ink-mute)">Konten surah ${n} belum tersedia.</p></div>`; };

function bindReader(s){
  document.querySelectorAll('.play').forEach(b=>{
    b.addEventListener('click', ()=>{ sequential=false; playAyat(s, parseInt(b.dataset.i)); });
  });
  document.getElementById('btn-surah').addEventListener('click', ()=>{ sequential=true; playAyat(s,1); });
  const tgl = document.getElementById('tgl-latin');
  tgl.addEventListener('click', ()=>{
    tgl.classList.toggle('on');
    document.body.classList.toggle('no-latin', !tgl.classList.contains('on'));
  });
  document.getElementById('f-plus').addEventListener('click', ()=>{
    arSize = Math.min(arSize+4, 58);
    document.documentElement.style.setProperty('--arabic-size', arSize+'px');
  });
  document.getElementById('f-min').addEventListener('click', ()=>{
    arSize = Math.max(arSize-4, 22);
    document.documentElement.style.setProperty('--arabic-size', arSize+'px');
  });
}

function setPlayingUI(i){
  document.querySelectorAll('.ayat').forEach(el=>el.classList.remove('playing'));
  document.querySelectorAll('.play').forEach(b=>b.textContent='\u25B6');
  if(i>0){
    const row = document.getElementById('ayat-'+i);
    if(!row) return;
    row.classList.add('playing');
    row.querySelector('.play').textContent='\u275A\u275A';
    row.scrollIntoView({behavior:'smooth', block:'center'});
  }
}

function playAyat(s, i){
  if(nowPlaying===i && !audio.paused){ stopAudio(); return; }
  nowPlaying=i;
  audio.src = audioUrl(s.nomor, i);
  audio.play().then(()=>setPlayingUI(i)).catch(()=>{
    stopAudio();
    alert('Audio tidak dapat diputar. Fitur audio membutuhkan koneksi internet.');
  });
}

function stopAudio(){
  audio.pause();
  nowPlaying=0; sequential=false;
  setPlayingUI(0);
}

audio.addEventListener('ended', ()=>{
  const s = REGISTRY[currentSurah];
  if(sequential && s && nowPlaying < s.ayat.length){ playAyat(s, nowPlaying+1); }
  else stopAudio();
});

  else if(location.hash === '#/asmaul-husna') renderAsmaulHusna();

function updateDashboard(){
  const stats = getReadStats();
  const juzRead = getReadJuz();
  const bms = getBookmarks();
  const lr = getLastRead();
  
  const statAyat = document.getElementById('stat-ayat');
  const statJuz = document.getElementById('stat-juz');
  const statBm = document.getElementById('stat-bm');
  if(statAyat) statAyat.textContent = stats.ayatRead||0;
  if(statJuz) statJuz.textContent = juzRead.length;
  if(statBm) statBm.textContent = bms.length;
  
  // Juz tracker
  const tracker = document.getElementById('juzTracker');
  if(tracker){
    let html = '';
    for(let j=1;j<=30;j++){
      const read = juzRead.includes(j);
      html += '<div class="juz-dot'+(read?' read':'')+'" title="Juz '+j+(read?' ✓':'')+'" onclick="location.hash=\'#/surah/'+(j*2-1)+'\'">'+j+'</div>';
    }
    tracker.innerHTML = html;
  }
  
  // Last read bar
  const bar = document.getElementById('lastReadBar');
  if(bar){
    if(lr){
      bar.innerHTML = '<a class="btn btn-primary" href="#/surah/'+lr.surah+'" style="margin-right:10px">📖 Lanjut: '+SURAH_NAMES[lr.surah-1]+' ayat '+lr.ayat+'</a><a class="btn btn-ghost" href="#/bookmarks">🔖 Bookmark ('+bms.length+')</a>';
    } else if(bms.length){
      bar.innerHTML = '<a class="btn btn-ghost" href="#/bookmarks">🔖 Bookmark ('+bms.length+')</a>';
    }
  }
}
updateDashboard();

function renderDoaSholat(){

  const doa = [

    {judul:"Doa Iftitah Kedua",ar:"إِنِّي وَجَّهْتُ وَجْهِيَ لِلَّذِي فَطَرَ السَّمَاوَاتِ وَالْأَرْضَ حَنِيفًا وَمَا أَنَا مِنَ الْمُشْرِكِينَ",lat:"Innī wajjahtu wajhiya lillażī faṭaras-samāwāti wal-arḍa ḥanīfaw wa mā ana minal-musyrikīn",tr:"Sesungguhnya aku hadapkan wajahku kepada Allah yang menciptakan langit dan bumi dengan cenderung kepada agama yang benar, dan aku bukanlah termasuk orang-orang musyrik."},
    {judul:"Ruku - Tasbih",ar:"سُبْحَانَ رَبِّيَ الْعَظِيمِ وَبِحَمْدِهِ",lat:"Subḥāna rabbiyal-'aẓīmi wa bi ḥamdih",tr:"Maha Suci Tuhanku Yang Maha Agung dan dengan pujian-Nya."},
    {judul:"I'tidal - Doa",ar:"سَمِعَ اللَّهُ لِمَنْ حَمِدَهُ رَبَّنَا وَلَكَ الْحَمْدُ",lat:"Sami'allāhu liman ḥamidah, rabbanā wa lakal-ḥamdu",tr:"Allah mendengar orang yang memuji-Nya. Ya Tuhan kami, bagi-Mu segala puji."},

    {judul:"Duduk Antara Dua Sujud",ar:"اللَّهُمَّ اغْفِرْ لِي وَارْحَمْنِي وَاجْبُرْنِي وَاهْدِنِي وَارْزُقْنِي",lat:"Allāhummagfir lī warḥamnī wajburnī wahdinī warzuqnī",tr:"Ya Allah, ampunilah aku, rahmatilah aku, cukupkanlah aku, berilah aku petunjuk, dan berilah aku rezeki."},
    {judul:"Tasyahud Awal",ar:"التَّحِيَّاتُ لِلَّهِ وَالصَّلَوَاتُ وَالطَّيِّبَاتُ، السَّلَامُ عَلَيْكَ أَيُّهَا النَّبِيُّ وَرَحْمَةُ اللَّهِ وَبَرَكَاتُهُ",lat:"At-taḥiyyātu lillāhi waṣ-ṣalawātu waṭ-ṭayyibāt, as-salāmu 'alaika ayyuhan-nabiyyu wa raḥmatullāhi wa barakātuh",tr:"Segala penghormatan, shalat, dan kebaikan adalah milik Allah. Semoga keselamatan, rahmat, dan berkah Allah tercurah kepadamu, wahai Nabi."},
    {judul:"Tasyahud Akhir",ar:"اللَّهُمَّ صَلِّ عَلَى مُحَمَّدٍ وَعَلَى آلِ مُحَمَّدٍ كَمَا صَلَّيْتَ عَلَى إِبْرَاهِيمَ وَعَلَى آلِ إِبْرَاهِيمَ إِنَّكَ حَمِيدٌ مَجِيدٌ",lat:"Allāhumma ṣalli 'alā muḥammadaw wa 'alā āli muḥammadin kamā ṣallaita 'alā ibrāhīma wa 'alā āli ibrāhīma innaka ḥamīdun majīd",tr:"Ya Allah, limpahkanlah shalawat kepada Muhammad dan keluarganya, sebagaimana Engkau limpahkan shalawat kepada Ibrahim dan keluarganya. Sesungguhnya Engkau Maha Terpuji lagi Maha Mulia."},
