[package]
name = "prayer-times-wasm"
version = "0.1.0"
edition = "2024"

[lib]
crate-type = ["cdylib"]

[dependencies]
libmuslim-rs = "0.1.0"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
wasm-bindgen = "0.2"
chrono = "0.4"

[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
